<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCRIPTEUR2BZ Skider</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        input, button {
            padding: 10px;
            margin: 5px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        button {
            background-color: #007bff;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>Welcome to SCRIPTEUR2BZ Skider</h1>
    <input type="text" id="inputText" placeholder="Enter text here...">
    <button id="replaceButton">Replace Text</button>
    <p id="outputText"></p>
    <script>
        document.getElementById('replaceButton').onclick = function() {
            var input = document.getElementById('inputText').value;
            // Placeholder for text replacement logic
            var replacedText = input.replace(/example/g, 'SCRIPTEUR2BZ');
            document.getElementById('outputText').innerText = replacedText;
        };
    </script>
</body>
</html>
